<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio+</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="control-window.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="panel control-window eq-shell">
    <header class="header control-header persona-header">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">A+</div>
        <div>
          <div class="brand">Audio+</div>
          <div class="site">Equalizer</div>
        </div>
      </div>
      <div class="window-actions">
        <span id="statusPill" class="status status-off">OFF</span>
        <button id="minimizeWindowButton" class="window-button" type="button" hidden aria-hidden="true" tabindex="-1">−</button>
        <button id="closeWindowButton" class="window-button" type="button" hidden aria-hidden="true" tabindex="-1">×</button>
      </div>
    </header>

    <div class="power-strip">
      <button id="powerButton" class="power primary-power compact-power" type="button">Turn on</button>
      <small id="powerHint">Turn on to hear EQ.</small>
    </div>

    <section id="spectrumPanel" class="section spectrum-zone" data-spectrum-always-on aria-labelledby="spectrumHeading">
      <div class="spectrum-heading">
        <span class="label-with-tip">
          <strong id="spectrumHeading">Live spectrum</strong>
          <button type="button" class="help-tip" aria-label="About Live spectrum" data-tip="Shows how loud each frequency is right now. Turn Audio+ on and play audio to see it move.">i</button>
        </span>
        <span id="spectrumStatus">Idle</span>
      </div>
      <div id="spectrumBars" class="spectrum-bars"></div>
      <div id="spectrumMetrics" class="spectrum-metrics">Turn on to see the mix.</div>
    </section>

    <section id="toneZone" class="section" aria-labelledby="toneHeading">
      <div class="section-title label-with-tip">
        <span id="toneHeading">Tone</span>
        <button type="button" class="help-tip" aria-label="About Tone" data-tip="Quick bass, mid, and treble controls. Turning Audio+ on still routes audio through its processor, even at 0.">i</button>
      </div>
      <div class="control-group compact"><div class="control-heading"><label for="bassSlider">Bass</label><output id="bassValue" for="bassSlider">0 dB</output></div><input id="bassSlider" type="range" min="-12" max="12" step="0.5" value="0" /></div>
      <div class="control-group compact"><div class="control-heading"><label for="midSlider">Mid</label><output id="midValue" for="midSlider">0 dB</output></div><input id="midSlider" type="range" min="-12" max="12" step="0.5" value="0" /></div>
      <div class="control-group compact"><div class="control-heading"><label for="trebleSlider">Treble</label><output id="trebleValue" for="trebleSlider">0 dB</output></div><input id="trebleSlider" type="range" min="-12" max="12" step="0.5" value="0" /></div>
      <div class="control-group compact"><div class="control-heading"><label for="volumeSlider">Volume</label><output id="volumeValue" for="volumeSlider">100%</output></div><input id="volumeSlider" type="range" min="0" max="150" step="1" value="100" /></div>
    </section>

    <!-- Karaoke / AI Karaoke temporarily disabled for public EQ-first release.
    <section id="karaokeZone" class="section persona-zone karaoke-zone" aria-labelledby="karaokeZoneHeading">
      <div class="section-title label-with-tip">
        <span id="karaokeZoneHeading">Karaoke</span>
        <button type="button" class="help-tip" aria-label="About Karaoke" data-tip="Removes center-panned singing with real-time stereo cancel (~200–5500 Hz). Works best on typical pop mixes. Off / Light / Karaoke / Max set strength. Keep bass protects kick/bass. AI Karaoke is stronger on capable GPUs.">i</button>
      </div>
      <div class="karaoke-presets segmented four-way" role="group" aria-label="Karaoke amount">
        <button type="button" data-vocal-preset="0" aria-pressed="true">Off</button>
        <button type="button" data-vocal-preset="45" aria-pressed="false">Light</button>
        <button type="button" data-vocal-preset="82" aria-pressed="false">Karaoke</button>
        <button type="button" data-vocal-preset="100" aria-pressed="false">Max</button>
      </div>
      <div class="control-group compact karaoke-control">
        <div class="control-heading"><label for="vocalReductionSlider">Vocals</label><output id="vocalReductionValue" for="vocalReductionSlider">0%</output></div>
        <input id="vocalReductionSlider" type="range" min="0" max="100" step="5" value="0" />
      </div>
      <label class="toggle-row karaoke-bass" for="keepBassToggle">
        <span class="label-with-tip">
          <strong>Keep bass</strong>
          <button type="button" class="help-tip" aria-label="About Keep bass" data-tip="Protects low end so kick and bass stay when vocals are reduced.">i</button>
        </span>
        <input id="keepBassToggle" type="checkbox" checked />
      </label>
      <div class="ai-karaoke-row">
        <button id="liveAiButton" class="live-ai-button quiet-ai" type="button">AI Karaoke</button>
        <button type="button" class="help-tip ai-help" aria-label="About AI Karaoke" data-tip="Stronger local vocal removal. First start loads a ~67 MB model from the Audio+ folder. Needs Audio+ on.">i</button>
      </div>
      <div id="liveAiStatus" class="live-ai-status" role="status" aria-live="polite">Optional stronger vocal removal.</div>
    </section>
    -->

    <details class="section fold" id="eqZone">
      <summary>
        <span class="label-with-tip">
          <span>10-band EQ</span>
          <button type="button" class="help-tip" aria-label="About 10-band EQ" data-tip="Fine control for each frequency. Use Tone for everyday tweaks; open this for precise EQ.">i</button>
        </span>
      </summary>
      <div id="eqGrid" class="eq-grid" aria-label="10-band equalizer"></div>
      <div class="advanced-footer"><div class="control-group compact"><div class="control-heading"><label for="preampSlider">Preamp</label><output id="preampValue" for="preampSlider">0 dB</output></div><input id="preampSlider" type="range" min="-12" max="6" step="0.5" value="0" /></div><label class="toggle-row" for="autoHeadroom"><span class="label-with-tip"><strong>Auto headroom</strong><button type="button" class="help-tip" aria-label="About Auto headroom" data-tip="Lowers overall level a bit when boosts are high, to reduce clipping.">i</button><small id="headroomValue">0 dB</small></span><input id="autoHeadroom" type="checkbox" checked /></label></div>
    </details>

    <details class="section fold">
      <summary>
        <span class="label-with-tip">
          <span>Voices</span>
          <button type="button" class="help-tip" aria-label="About Voices" data-tip="Dialogue lifts speech. Night mode softens loud jumps for late listening.">i</button>
        </span>
      </summary>
      <div id="clarityZone">
        <div class="control-group compact">
          <div class="control-heading"><label for="dialogueBoostSlider">Dialogue</label><output id="dialogueBoostValue" for="dialogueBoostSlider">0%</output></div>
          <input id="dialogueBoostSlider" type="range" min="0" max="100" step="5" value="0" />
        </div>
        <div class="night-mode-row">
          <div><strong>Night mode</strong></div>
          <div id="nightModeButtons" class="segmented" role="group" aria-label="Night Mode">
            <button type="button" data-night-mode="off" aria-pressed="true">Off</button>
            <button type="button" data-night-mode="light" aria-pressed="false">Light</button>
            <button type="button" data-night-mode="strong" aria-pressed="false">Strong</button>
          </div>
        </div>
      </div>
    </details>

    <details class="section fold">
      <summary>
        <span class="label-with-tip">
          <span>Presets</span>
          <button type="button" class="help-tip" aria-label="About Presets" data-tip="One-tap sound shapes. Auto-fix listens briefly and applies a small EQ correction.">i</button>
        </span>
      </summary>
      <div id="soundZone">
        <button id="smartFixButton" class="smart-fix-button" type="button">Auto-fix</button>
        <div id="smartFixResult" class="smart-fix-result" role="status" aria-live="polite">Play something, then tap auto-fix.</div>
        <button id="clearSmartFixButton" class="small-button smart-fix-clear" type="button" hidden>Clear auto-fix</button>
        <div id="presetGrid" class="preset-grid" aria-label="Built-in audio presets"></div>
      </div>
    </details>

    <details id="advancedPanel" class="advanced power-user-zone fold">
      <summary>More</summary>
      <div class="utility-body">
        <label class="toggle-row" for="siteProfileToggle"><span><strong>Remember this site</strong><small id="siteProfileHint">Off uses your global settings.</small></span><input id="siteProfileToggle" type="checkbox" /></label>
        <div class="preset-library-row"><select id="customPresetSelect" aria-label="Saved custom presets"><option value="">Saved presets</option></select><button id="applyCustomPreset" class="small-button" type="button" disabled>Apply</button><button id="deleteCustomPreset" class="small-button danger" type="button" disabled>Delete</button></div>
        <div class="save-preset-row"><input id="customPresetName" type="text" maxlength="40" placeholder="Name" aria-label="Preset name" /><button id="saveCustomPreset" class="small-button" type="button">Save</button></div>
        <!-- <a class="ai-lab-link diagnostics-link" href="ai-lab.html" target="_blank" rel="noopener">AI lab</a> -->
      </div>
    </details>

    <div class="actions footer-actions">
      <button id="bypassButton" class="secondary" type="button" aria-pressed="false">Bypass</button>
      <button type="button" class="help-tip footer-help" aria-label="About Bypass" data-tip="Keeps Audio+ connected but skips EQ processing for a closer-to-original sound.">i</button>
      <button id="resetButton" class="secondary" type="button">Reset</button>
    </div>
    <p id="message" class="message global-message" role="status" aria-live="polite"></p>
  </main>
  <script src="sidepanel-target-sync.js"></script>
  <script type="module" src="popup.js"></script>
  <script type="module" src="persona-actions.js"></script>
  <script type="module" src="source-overview.js"></script>
  <!-- <script type="module" src="v3-live.js"></script> -->
</body>
</html>
