name: Audio+ CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Build extension assets
        run: npm run build
      - name: Verify packaged AI runtime assets
        run: |
          test -f dist/ai-karaoke-lab.js
          test -f vendor/ort/ort-wasm-simd-threaded.jsep.wasm
      - name: Run release tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check dist/ai-karaoke-lab.js
