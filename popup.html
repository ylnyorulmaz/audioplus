<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio+</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="panel">
    <header class="header">
      <div>
        <div class="brand">AUDIO+</div>
        <div id="siteLabel" class="site">Current tab</div>
      </div>
      <span id="statusPill" class="status status-off">OFF</span>
    </header>

    <button id="powerButton" class="power" type="button">Enable Audio+</button>
    <p id="powerHint" class="power-hint">Enable processing for this tab.</p>

    <section class="section" aria-labelledby="quickModesHeading">
      <div class="section-title" id="quickModesHeading">Quick modes</div>
      <div id="presetGrid" class="preset-grid" aria-label="Built-in audio presets"></div>
    </section>

    <section class="section" aria-labelledby="toneHeading">
      <div class="section-title" id="toneHeading">Tone</div>

      <div class="control-group compact">
        <div class="control-heading">
          <label for="bassSlider">Bass</label>
          <output id="bassValue" for="bassSlider">0 dB</output>
        </div>
        <input id="bassSlider" type="range" min="-12" max="12" step="0.5" value="0" />
      </div>

      <div class="control-group compact">
        <div class="control-heading">
          <label for="midSlider">Mid</label>
          <output id="midValue" for="midSlider">0 dB</output>
        </div>
        <input id="midSlider" type="range" min="-12" max="12" step="0.5" value="0" />
      </div>

      <div class="control-group compact">
        <div class="control-heading">
          <label for="trebleSlider">Treble</label>
          <output id="trebleValue" for="trebleSlider">0 dB</output>
        </div>
        <input id="trebleSlider" type="range" min="-12" max="12" step="0.5" value="0" />
      </div>

      <div class="control-group compact">
        <div class="control-heading">
          <label for="volumeSlider">Volume</label>
          <output id="volumeValue" for="volumeSlider">100%</output>
        </div>
        <input id="volumeSlider" type="range" min="0" max="150" step="1" value="100" />
      </div>
    </section>

    <section class="section" aria-labelledby="siteProfileHeading">
      <div class="section-title" id="siteProfileHeading">This site</div>
      <label class="toggle-row" for="siteProfileToggle">
        <span>
          <strong>Remember settings for this site</strong>
          <small id="siteProfileHint">Uses your global settings.</small>
        </span>
        <input id="siteProfileToggle" type="checkbox" />
      </label>
    </section>

    <section class="section" aria-labelledby="customPresetHeading">
      <div class="section-title" id="customPresetHeading">Custom presets</div>
      <div class="preset-library-row">
        <select id="customPresetSelect" aria-label="Saved custom presets">
          <option value="">No saved presets</option>
        </select>
        <button id="applyCustomPreset" class="small-button" type="button" disabled>Apply</button>
        <button id="deleteCustomPreset" class="small-button danger" type="button" disabled>Delete</button>
      </div>
      <div class="save-preset-row">
        <input id="customPresetName" type="text" maxlength="40" placeholder="Preset name" aria-label="Preset name" />
        <button id="saveCustomPreset" class="small-button" type="button">Save current</button>
      </div>
    </section>

    <details id="advancedPanel" class="advanced">
      <summary>Advanced <span>10-band EQ + preamp</span></summary>
      <div id="eqGrid" class="eq-grid" aria-label="10-band equalizer"></div>

      <div class="advanced-footer">
        <div class="control-group compact">
          <div class="control-heading">
            <label for="preampSlider">Preamp</label>
            <output id="preampValue" for="preampSlider">0 dB</output>
          </div>
          <input id="preampSlider" type="range" min="-12" max="6" step="0.5" value="0" />
        </div>

        <label class="toggle-row" for="autoHeadroom">
          <span>
            <strong>Auto headroom</strong>
            <small id="headroomValue">0 dB compensation</small>
          </span>
          <input id="autoHeadroom" type="checkbox" checked />
        </label>
      </div>
    </details>

    <div class="actions">
      <button id="bypassButton" class="secondary" type="button" aria-pressed="false">Bypass</button>
      <button id="resetButton" class="secondary" type="button">Reset</button>
    </div>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p class="privacy">Audio stays on your device. Presets and profiles are stored locally in Chrome.</p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
